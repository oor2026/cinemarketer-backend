spring.application.name=cinemarketer

# ==============================================
# CONFIGURACION DE BASE DE DATOS (POSTGRESQL)
# ==============================================

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:cinemarketer}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================
# CONFIGURACION DE JPA / HIBERNATE
# ==============================================

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==============================================
# LOGGING
# ==============================================

logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}
logging.level.web=${LOG_LEVEL_WEB:WARN}
logging.level.com.example.demo=${LOG_LEVEL_APP:INFO}

# ==============================================
# ERRORES
# ==============================================

server.error.include-stacktrace=${ERROR_STACKTRACE:never}
server.error.include-message=${ERROR_MESSAGE:never}
server.address=0.0.0.0

# ==============================================
# MERCADO PAGO
# ==============================================

mercadopago.access-token=${MP_ACCESS_TOKEN}
mercadopago.public-key=${MP_PUBLIC_KEY}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET}
mercadopago.sandbox=${MP_SANDBOX:false}

# VALOR SUSCRIPCION PREMIUM
subscription.price=${SUBSCRIPTION_PRICE:999.0}

# ==============================================
# EMAIL
# ==============================================

spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_TLS:true}
app.mail.from=${MAIL_FROM:info@cinemarketer.com.ar}

# ==============================================
# URLS BASE
# ==============================================

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend.url=${APP_FRONTEND_URL:https://cinemarketer.com.ar}

# ==============================================
# JWT
# ==============================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==============================================
# CORS
# ==============================================

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://cinemarketer.com.ar}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

# ==============================================
# TMDB API
# ==============================================

tmdb.api.token=${TMDB_API_TOKEN}
tmdb.api.url=${TMDB_API_URL:https://api.themoviedb.org/3}
tmdb.image.base.url=${TMDB_IMAGE_BASE_URL:https://image.tmdb.org/t/p}

# ==============================================
# CLOUDINARY
# ==============================================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ==============================================
# MULTIPART
# ==============================================

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:5MB}

