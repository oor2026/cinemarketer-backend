spring.application.name=cinemarketer

# ==============================================
# CONFIGURACION DE BASE DE DATOS (POSTGRESQL)
# ==============================================

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:cinemarketer}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================
# CONFIGURACION DE JPA / HIBERNATE
# ==============================================

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==============================================
# LOGGING
# ==============================================

logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:DEBUG}
logging.level.web=${LOG_LEVEL_WEB:DEBUG}
logging.level.com.example.demo=${LOG_LEVEL_APP:DEBUG}

# ==============================================
# ERRORES
# ==============================================

server.error.include-stacktrace=${ERROR_STACKTRACE:always}
server.error.include-message=${ERROR_MESSAGE:always}

# ==============================================
# MERCADO PAGO
# ==============================================

mercadopago.access-token=${MP_ACCESS_TOKEN}
mercadopago.public-key=${MP_PUBLIC_KEY}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET}
mercadopago.sandbox=${MP_SANDBOX:false}

# ==============================================
# EMAIL
# ==============================================

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_TLS:false}

# ==============================================
# URLS BASE
# ==============================================

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:63342}

# ==============================================
# JWT
# ==============================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==============================================
# CORS
# ==============================================

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:63342}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

# ==============================================
# TMDB API
# ==============================================

tmdb.api.token=${TMDB_API_TOKEN}
tmdb.api.url=${TMDB_API_URL:https://api.themoviedb.org/3}
tmdb.image.base.url=${TMDB_IMAGE_BASE_URL:https://image.tmdb.org/t/p}

# ==============================================
# CLOUDINARY
# ==============================================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ==============================================
# MULTIPART
# ==============================================

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:5MB}