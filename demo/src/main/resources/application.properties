spring.application.name=cinemarketer

# ==============================================
# CONFIGURACIÓN DE BASE DE DATOS
# ==============================================

# Para MySQL (recomendado para producción)
spring.datasource.url=jdbc:mysql://localhost:3306/cinemarketer?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==============================================

# Crear/actualizar las tablas automáticamente
# create-drop: crea al iniciar, borra al cerrar (solo para pruebas)
# update: actualiza el esquema sin borrar datos
# validate: solo valida que las tablas existan
# none: no hace nada
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL en consola (útil para depurar)
spring.jpa.show-sql=true

# Formatear SQL para que sea legible
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de la base de datos
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Logging de Spring Security (nivel DEBUG para ver qué rutas están protegidas)
logging.level.org.springframework.security=DEBUG
logging.level.web=DEBUG
logging.level.com.example.demo=DEBUG

# Mostrar más detalles de errores
server.error.include-stacktrace=always
server.error.include-message=always

